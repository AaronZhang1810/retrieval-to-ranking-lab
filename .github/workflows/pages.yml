name: Deploy report to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    name: Validate and package Pages artifact
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the locked runtime environment
        run: "python -m pip install --only-binary=:all: -r requirements-lock.txt"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit the working tree release boundary
        run: python public_release.py --check
      - name: Audit the exact Git index and complete history
        run: python public_release.py --check --staged --history
      - name: Verify the committed public outputs are fresh
        run: python -m unittest tests.test_public_outputs -v
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
